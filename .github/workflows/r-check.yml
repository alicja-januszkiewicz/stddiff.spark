name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    container:
      image: rocker/verse:4.5.2  # includes R + common dev tools
    env:
      R_LIBS_USER: ${{ github.workspace }}/Rlibs

    steps:
    - uses: actions/checkout@v3

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.5.2'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev default-jdk

    - name: Install R package dependencies
      run: |
        install.packages(c(
          "remotes", "devtools", "testthat", "knitr", "rmarkdown", "dplyr", "tidyr"
        ))
        remotes::install_version("sparklyr", version = "1.8.0")

    - name: Install package
      run: R CMD INSTALL .

    - name: Check package
      run: R CMD check . --no-manual --as-cran

    - name: Run tests
      run: Rscript -e "library(testthat); testthat::test_dir('tests/testthat')"
